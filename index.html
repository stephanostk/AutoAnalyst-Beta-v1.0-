<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AutoAnalyst</title>
<style>
  :root {
    --bg: #0b0e11;
    --panel: #12161b;
    --line: #22282f;
    --text: #e6e9ec;
    --muted: #8a929b;
    --accent: #3ddc97;
    --accent-dim: #1f5c42;
    --error: #e2554d;
    --error-dim: #4a201d;
    --amber: #e0a63d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", sans-serif;
    padding: 40px 24px 80px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }
  .brand .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .brand h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .tagline { color: var(--muted); font-size: 13px; margin: 0 0 32px 19px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }

  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

  .dropzone {
    border: 1.5px dashed var(--line);
    border-radius: 8px;
    padding: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--text); }
  .dropzone input { display: none; }
  .dropzone .filename { color: var(--accent); font-weight: 500; }

  textarea, .dropzone {
    width: 100%;
  }
  textarea {
    background: #0e1216;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 14px;
    resize: vertical;
    min-height: 54px;
    margin-top: 12px;
  }
  textarea:focus, .dropzone:focus-visible { outline: none; border-color: var(--accent); }

  button.run {
    margin-top: 16px;
    width: 100%;
    background: var(--accent);
    color: #06120c;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button.run:hover { opacity: 0.88; }
  button.run:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  .status-line {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
    margin: 14px 0 0;
  }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .plan-item {
    display: flex; gap: 10px;
    font-size: 13px;
    padding: 6px 0;
    color: var(--muted);
  }
  .plan-item .n {
    color: var(--accent);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    flex-shrink: 0;
  }

  .step {
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .step-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
    font-size: 13px;
  }
  .step-head:hover { background: #171b20; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .badge.ok { background: var(--accent-dim); color: var(--accent); }
  .badge.fail { background: var(--error-dim); color: var(--error); }
  .step-desc { flex: 1; }
  .attempts { color: var(--muted); font-size: 11px; }
  .step-output {
    display: none;
    background: #0a0d10;
    border-top: 1px solid var(--line);
    padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px;
    color: #b9c0c7;
    white-space: pre-wrap;
    max-height: 260px;
    overflow-y: auto;
  }
  .step.open .step-output { display: block; }
  .step.open .chev { transform: rotate(90deg); }
  .chev { color: var(--muted); transition: transform 0.15s; font-size: 11px; }

  .report {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
  }

  .error-panel {
    border-color: var(--error-dim);
    background: #1a0f0e;
    color: #f0b3ae;
    font-size: 13px;
    white-space: pre-wrap;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }

  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .live-log {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .live-log .line { padding: 3px 0; display: flex; gap: 8px; }
  .live-log .line.active { color: var(--amber); }
  .live-log .line.ok { color: var(--accent); }
  .live-log .line.fail { color: var(--error); }

</style>
</head>
<body>
<div class="wrap">

  <div class="brand"><span class="dot"></span><h1>AutoAnalyst</h1></div>
  <p class="tagline">Upload a dataset. Ask a question. Watch it work.</p>

  <div class="panel">
    <label for="fileInput">Dataset</label>
    <div class="dropzone" id="dropzone" tabindex="0">
      <span id="dropzoneText">Click to choose a CSV, or drag one here</span>
      <input type="file" id="fileInput" accept=".csv">
    </div>

    <label for="question" style="margin-top:16px;">Question</label>
    <textarea id="question" placeholder="e.g. Why is the Furniture category losing money?"></textarea>

    <button class="run" id="runBtn">Run analysis</button>
    <div class="status-line" id="statusLine" style="display:none;">
      <div class="spinner"></div>
      <span id="statusText">Working...</span>
    </div>
    <p class="hint">Backend must be running at http://localhost:8000</p>
  </div>

  <div id="results"></div>

</div>

<script>
const API_URL = "http://localhost:8000/analyze-stream";

const fileInput = document.getElementById("fileInput");
const dropzone = document.getElementById("dropzone");
const dropzoneText = document.getElementById("dropzoneText");
const questionInput = document.getElementById("question");
const runBtn = document.getElementById("runBtn");
const statusLine = document.getElementById("statusLine");
const statusText = document.getElementById("statusText");
const resultsDiv = document.getElementById("results");

let selectedFile = null;

dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("keydown", (e) => { if (e.key === "Enter") fileInput.click(); });
dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("drag");
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files.length) setFile(fileInput.files[0]);
});

function setFile(file) {
  selectedFile = file;
  dropzoneText.innerHTML = 'Selected: <span class="filename">' + file.name + "</span>";
}

function setStatus(text) {
  statusLine.style.display = text ? "flex" : "none";
  statusText.textContent = text || "";
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

runBtn.addEventListener("click", async () => {
  const question = questionInput.value.trim();

  if (!selectedFile) {
    resultsDiv.innerHTML = '<div class="panel error-panel">Choose a CSV file first.</div>';
    return;
  }
  if (!question) {
    resultsDiv.innerHTML = '<div class="panel error-panel">Enter a question first.</div>';
    return;
  }

  runBtn.disabled = true;
  resultsDiv.innerHTML =
    '<div class="panel"><p class="section-title">Live progress</p><div class="live-log" id="liveLog"></div></div>';
  const liveLog = document.getElementById("liveLog");

  const state = { plan: [], steps: [], report: null };

  function logLine(text, cls) {
    const div = document.createElement("div");
    div.className = "line" + (cls ? " " + cls : "");
    div.textContent = text;
    liveLog.appendChild(div);
    liveLog.scrollTop = liveLog.scrollHeight;
  }

  const formData = new FormData();
  formData.append("file", selectedFile);
  formData.append("question", question);

  try {
    const resp = await fetch(API_URL, { method: "POST", body: formData });
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(errText || resp.statusText);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        let event;
        try { event = JSON.parse(line); } catch (e) { continue; }
        handleEvent(event);
      }
    }
  } catch (err) {
    logLine("Error: " + err.message, "fail");
  } finally {
    runBtn.disabled = false;
  }

  function handleEvent(event) {
    if (event.type === "status") {
      logLine(event.message);
    } else if (event.type === "plan") {
      state.plan = event.plan;
      logLine("Plan ready (" + event.plan.length + " steps)", "ok");
    } else if (event.type === "step_start") {
      logLine("Step " + event.step_num + ": " + event.description + " ...", "active");
    } else if (event.type === "step_done") {
      state.steps.push(event);
      logLine(
        "Step " + event.step_num + ": " + (event.success ? "done" : "failed") +
        " (" + event.attempts + " attempt" + (event.attempts > 1 ? "s" : "") + ")",
        event.success ? "ok" : "fail"
      );
    } else if (event.type === "report") {
      state.report = event.report;
      logLine("Report ready", "ok");
      renderFinal(state);
    } else if (event.type === "error") {
      logLine("Error: " + event.message, "fail");
    } else if (event.type === "done") {
      logLine("Done.", "ok");
    }
  }
});

function renderFinal(data) {
  let html = "";

  html += '<div class="panel"><p class="section-title">Plan</p>';
  data.plan.forEach((step, i) => {
    html += '<div class="plan-item"><span class="n">' + (i + 1) + ".</span><span>" + escapeHtml(step) + "</span></div>";
  });
  html += "</div>";

  html += '<div class="panel"><p class="section-title">Steps</p>';
  data.steps.forEach((s) => {
    const badgeClass = s.success ? "ok" : "fail";
    const badgeText = s.success ? "OK" : "FAILED";
    html +=
      '<div class="step" data-idx="' + s.step_num + '">' +
        '<div class="step-head" onclick="this.parentElement.classList.toggle(\'open\')">' +
          '<span class="badge ' + badgeClass + '">' + badgeText + "</span>" +
          '<span class="step-desc">Step ' + s.step_num + ": " + escapeHtml(s.description) + "</span>" +
          '<span class="attempts">' + s.attempts + " attempt" + (s.attempts > 1 ? "s" : "") + "</span>" +
          '<span class="chev">&#9656;</span>' +
        "</div>" +
        '<div class="step-output">' + escapeHtml(s.output) + "</div>" +
      "</div>";
  });
  html += "</div>";

  html += '<div class="panel"><p class="section-title">Report</p><div class="report">' + escapeHtml(data.report) + "</div></div>";

  resultsDiv.insertAdjacentHTML("beforeend", html);
}
</script>
</body>
</html>
